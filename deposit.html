<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - PTMPay</title>
    <!-- नया स्टाइलिश फोंट -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #07090e; display: flex; justify-content: center; min-height: 100vh; color: #f1f5f9; }
        
        .app-container { width: 100%; max-width: 480px; background: #10151f; min-height: 100vh; display: flex; flex-direction: column; position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        
        /* नया मॉडर्न ग्रेडिएंट हेडर */
        .top-header { background: linear-gradient(135deg, #2563eb, #4f46e5); color: white; padding: 28px 20px 22px 20px; text-align: center; border-bottom-left-radius: 28px; border-bottom-right-radius: 28px; position: relative; }
        .top-header h2 { font-size: 19px; margin-bottom: 5px; text-align: left; position: absolute; top: 20px; left: 20px; font-weight: 700; letter-spacing: 0.5px; }
        .amount-title { font-size: 12px; opacity: 0.85; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .payment-amount { font-size: 36px; font-weight: 700; margin: 4px 0; }
        .timer { font-size: 13px; background: rgba(0, 0, 0, 0.2); display: inline-block; padding: 5px 16px; border-radius: 30px; margin-top: 6px; font-weight: 500; }
        
        /* टैब स्टાઇલ */
        .tabs-container { display: flex; justify-content: space-around; background: #10151f; padding: 20px 20px 10px 20px; }
        .tab-btn { font-size: 14px; font-weight: 600; color: #64748b; cursor: pointer; padding-bottom: 8px; border-bottom: 2px solid transparent; transition: all 0.3s ease; }
        .tab-btn.active { color: #60a5fa; border-bottom-color: #60a5fa; }
        
        .content-body { padding: 15px 20px 40px 20px; flex: 1; }
        .section-box { background: #182030; border: 1px solid #222d42; border-radius: 16px; padding: 16px; margin-bottom: 15px; }
        .section-title { font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .methods-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .pay-method-btn { display: flex; align-items: center; justify-content: center; padding: 13px; border: 1px solid #222d42; border-radius: 12px; background: #10151f; color: #f8fafc; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .pay-method-btn:hover { border-color: #2563eb; }
        
        .warning-box { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.2); color: #fbbf24; padding: 12px 14px; border-radius: 12px; font-size: 12px; margin-bottom: 15px; font-weight: 500; }
        
        .transfer-box { background: #182030; border: 1px solid #222d42; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
        .copy-field { display: flex; justify-content: space-between; align-items: center; background: #10151f; border: 1px solid #222d42; padding: 13px 15px; border-radius: 12px; margin-bottom: 12px; color: #60a5fa; font-weight: 600; font-size: 14px; cursor: pointer; }
        
        .utr-input { width: 100%; padding: 14px 16px; border: 1px solid #222d42; border-radius: 12px; background: #10151f; color: white; margin-bottom: 12px; font-size: 14px; outline: none; transition: 0.2s; }
        .utr-input:focus { border-color: #2563eb; }
        
        .submit-btn { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .submit-btn:hover { background: #1d4ed8; }
        
        #qrSection { display: none; }
        .qr-card { background: #182030; border: 1px solid #222d42; border-radius: 16px; padding: 22px; text-align: center; }
        .qr-wrapper { display: inline-block; padding: 14px; background: white; border-radius: 14px; margin: 15px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        #merchantLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #10151f; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { border: 4px solid #182030; border-top: 4px solid #2563eb; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; visibility: hidden; backdrop-filter: blur(5px); }
        .modal-overlay.active { visibility: visible; }
        .modal-box { background: #182030; border: 1px solid #222d42; padding: 30px; border-radius: 24px; width: 90%; max-width: 320px; text-align: center; color: #f8fafc; }
        .modal-title { font-size: 20px; margin-bottom: 8px; font-weight: 700; }
        .modal-desc { color: #94a3b8; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .modal-btn { background: #2563eb; color: #fff; width: 100%; padding: 13px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

<div id="merchantLoader">
    <div class="spinner"></div>
    <p style="margin-top:20px; color:#60a5fa; font-weight:500; font-size: 14px;">Payment Processing, Please Wait...</p>
</div>

<div class="app-container">
    <div class="top-header">
        <h2>Claud-pay</h2>
        <div class="amount-title">Payment Amount</div>
        <div class="payment-amount" id="headerAmount">₹0</div>
        <div class="timer" id="timer">00:09:41</div>
    </div>

    <div class="tabs-container">
        <div id="tabDirect" class="tab-btn active" onclick="switchTab('direct')">Direct Transfer</div>
        <div id="tabQr" class="tab-btn" onclick="switchTab('qr')">Scan QRCode</div>
    </div>

    <div class="content-body">
        <div id="directContent">
            <div class="section-box">
                <div class="section-title">Select Payment App</div>

                    <a href="#" id="phonepeAppBtn1" class="pay-method-btn"><svg width="64px" height="64px" viewBox="-48 -48 144.00 144.00" xmlns="http://www.w3.org/2000/svg" fill="#9525f7" stroke="#9525f7" stroke-width="0.00048000000000000007" transform="rotate(0)matrix(1, 0, 0, 1, 0, 0)"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round" stroke="#CCCCCC" stroke-width="4.896"><defs><style>.a{fill:none;stroke:#8040ff;stroke-linecap:round;stroke-linejoin:round;}</style></defs><circle class="a" cx="24" cy="24" r="21.5"></circle><line class="a" x1="19.8055" y1="8.5" x2="28.8973" y2="18.8312"></line><line class="a" x1="13.2366" y1="18.8312" x2="34.7634" y2="18.8312"></line><path class="a" d="M29.2874,39.5c-.4439-9.0064-.39-20.6688-.39-20.6688"></path><path class="a" d="M18.97,18.8312c0,3.1275-.1189,7.93-.1189,9.0192a4.2326,4.2326,0,0,0,4.9636,4.2977,30.2014,30.2014,0,0,0,5.1918-1.1168"></path></g><g id="SVGRepo_iconCarrier"><defs><style>.a{fill:none;stroke:#8040ff;stroke-linecap:round;stroke-linejoin:round;}</style></defs><circle class="a" cx="24" cy="24" r="21.5"></circle><line class="a" x1="19.8055" y1="8.5" x2="28.8973" y2="18.8312"></line><line class="a" x1="13.2366" y1="18.8312" x2="34.7634" y2="18.8312"></line><path class="a" d="M29.2874,39.5c-.4439-9.0064-.39-20.6688-.39-20.6688"></path><path class="a" d="M18.97,18.8312c0,3.1275-.1189,7.93-.1189,9.0192a4.2326,4.2326,0,0,0,4.9636,4.2977,30.2014,30.2014,0,0,0,5.1918-1.1168"></path></g></svg></a>
                </div>
            </div>
            <div class="warning-box">📢 Payment can only be made once don't use this QR to pay again.</div>
            <div class="transfer-box">
                <div class="copy-field" id="upiText" onclick="copyUpiText()">paytm.s2sqr95@pty <span style="font-size:11px; background:#2563eb; color:white; padding:4px 10px; border-radius:6px;">COPY</span></div>
                <div class="copy-field" id="amountText">0 RS</div>
                <input type="text" id="utrInputDirect" class="utr-input" placeholder="Enter 12-digit UTR">
                <button class="submit-btn" onclick="submitUTR('utrInputDirect')">Submit UTR</button>
            </div>
        </div>

        <div id="qrSection">
            <div class="qr-card">
                <div class="qr-wrapper"><div id="qrcode"></div></div>
                <input type="text" id="utrInputQr" class="utr-input" placeholder="Enter 12-digit UTR" style="margin-top: 10px;">
                <button class="submit-btn" onclick="submitUTR('utrInputQr')">Submit UTR</button>
            </div>
        </div>
    </div>
</div>

<div id="customModal" class="modal-overlay">
    <div class="modal-box">
        <h3 class="modal-title" id="modalTitle">Status</h3>
        <p class="modal-desc" id="modalDesc">Message</p>
        <button class="modal-btn" id="modalActionBtn" onclick="handleModalAction()">OK</button>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAyFldowBw6ChbopLGCCQ8U7_RH4kmyFpM",
      authDomain: "creditinvestapp.firebaseapp.com",
      projectId: "creditinvestapp",
      storageBucket: "creditinvestapp.firebasestorage.app",
      messagingSenderId: "299058832737",
      appId: "1:299058832737:web:fe1c1df553e209715c1120"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const amount = urlParams.get('amount') || '0.00';
    const upiID = "paytm.s2sqr95@pty";
    const userUID = localStorage.getItem('userUID') || localStorage.getItem('uid') || localStorage.getItem('userId') || 'GUEST';

    document.getElementById('headerAmount').innerText = "₹" + amount;
    document.getElementById('amountText').innerText = amount + " RS";

    const upiDeepLink = `upi://pay?pa=${upiID}&pn=Merchant&am=${amount}&cu=INR`;
    document.getElementById('paytmAppBtn1').href = upiDeepLink;
    document.getElementById('phonepeAppBtn1').href = upiDeepLink;
    document.getElementById('phonepeAppBtn1').href = upiDeepLink;
    document.getElementById('phonepeAppBtn1').href = upiDeepLink;
    document.getElementById('phonepeAppBtn1').href = upiDeepLink;

    new QRCode(document.getElementById("qrcode"), { 
        text: upiDeepLink, 
        width: 170, 
        height: 170,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });

    function switchTab(tab) {
        document.getElementById('directContent').style.display = (tab === 'direct') ? 'block' : 'none';
        document.getElementById('qrSection').style.display = (tab === 'qr') ? 'block' : 'none';
        document.getElementById('tabDirect').className = (tab === 'direct') ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tabQr').className = (tab === 'qr') ? 'tab-btn active' : 'tab-btn';
    }

    function copyUpiText() {
        navigator.clipboard.writeText(upiID);
        alert("UPI ID Copied: " + upiID);
    }

    let isSuccessState = false;

    function showModal(title, desc, color, isSuccess) {
        isSuccessState = isSuccess;
        const titleEl = document.getElementById('modalTitle');
        titleEl.innerText = title;
        titleEl.style.color = color;
        document.getElementById('modalDesc').innerText = desc;
        
        const btn = document.getElementById('modalActionBtn');
        btn.innerText = isSuccess ? "Back to History" : "OK";

        document.getElementById('customModal').classList.add('active');
    }

    function handleModalAction() {
        document.getElementById('customModal').classList.remove('active');
        if (isSuccessState) {
            window.location.href = 'recharge.html';
        }
    }

    function submitUTR(inputId) {
        const utr = document.getElementById(inputId).value.trim();
        
        if(!utr || utr.length < 12) {
            showModal('Invalid UTR', 'Please enter a valid 12-digit UTR number.', '#ef4444', false);
            return;
        }

        document.getElementById('merchantLoader').style.display = 'flex';

        setTimeout(() => {
            const orderId = 'REC' + Date.now();
            const paymentData = {
                orderId: orderId,
                uid: userUID,
                amount: Number(amount),
                utrNumber: utr,
                status: 'pending',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("recharges").doc(orderId).set(paymentData)
            .then(() => {
                document.getElementById('merchantLoader').style.display = 'none';
                showModal('Success', 'Payment Submitted Successfully! Please wait 5 minutes.', '#60a5fa', true);
            })
            .catch(error => {
                document.getElementById('merchantLoader').style.display = 'none';
                showModal('Error', 'Failed: ' + error.message, '#ef4444', false);
            });
        }, 2000);
    }
</script>
</body>
</html>
