<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - PTMPay</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; display: flex; justify-content: center; min-height: 100vh; color: #f8fafc; }
        .app-container { width: 100%; max-width: 480px; background: #131c31; min-height: 100vh; display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .top-header { background: linear-gradient(135deg, #059669, #0d9488); color: white; padding: 25px 20px 20px 20px; text-align: center; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; position: relative; }
        .top-header h2 { font-size: 20px; margin-bottom: 5px; text-align: left; position: absolute; top: 20px; left: 20px; font-weight: 600; }
        .amount-title { font-size: 13px; opacity: 0.9; margin-top: 15px; }
        .payment-amount { font-size: 38px; font-weight: 700; margin: 5px 0; }
        .timer { font-size: 14px; background: rgba(0, 0, 0, 0.25); display: inline-block; padding: 4px 14px; border-radius: 20px; margin-top: 5px; }
        .tabs-container { display: flex; justify-content: space-around; background: #131c31; padding: 18px 20px 10px 20px; }
        .tab-btn { font-size: 15px; font-weight: 600; color: #64748b; cursor: pointer; padding-bottom: 8px; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #34d399; border-bottom-color: #34d399; }
        .content-body { padding: 15px 20px 40px 20px; flex: 1; }
        .section-box { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 15px; margin-bottom: 15px; }
        .section-title { font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; }
        .methods-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .pay-method-btn { display: flex; align-items: center; justify-content: center; padding: 12px; border: 1px solid #334155; border-radius: 10px; background: #131c31; color: #f1f5f9; text-decoration: none; font-weight: 600; font-size: 14px; }
        .warning-box { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.2); color: #fbbf24; padding: 12px; border-radius: 12px; font-size: 12px; margin-bottom: 15px; }
        .transfer-box { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 15px; margin-bottom: 20px; }
        .copy-field { display: flex; justify-content: space-between; align-items: center; background: #131c31; border: 1px solid #334155; padding: 12px 14px; border-radius: 10px; margin-bottom: 12px; color: #34d399; font-weight: 600; cursor: pointer; }
        .utr-input { width: 100%; padding: 14px; border: 1px solid #334155; border-radius: 10px; background: #131c31; color: white; margin-bottom: 10px; }
        .submit-btn { width: 100%; background: #059669; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        #qrSection { display: none; }
        .qr-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; text-align: center; }
        .qr-wrapper { display: inline-block; padding: 12px; background: white; border-radius: 12px; margin: 15px 0; }

        #merchantLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #131c31; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { border: 4px solid #1e293b; border-top: 4px solid #059669; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 9999; visibility: hidden; }
        .modal-overlay.active { visibility: visible; }
        .modal-box { background: #ffffff; padding: 30px; border-radius: 20px; width: 90%; max-width: 320px; text-align: center; color: #000; }
        .modal-title { font-size: 20px; margin-bottom: 10px; font-weight: 700; }
        .modal-desc { color: #334155; font-size: 15px; margin-bottom: 25px; line-height: 1.5; }
        .modal-btn { background: #059669; color: #fff; width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

<div id="merchantLoader">
    <div class="spinner"></div>
    <p style="margin-top:20px; color:#34d399; font-weight:500;">Payment Processing, Please Wait...</p>
</div>

<div class="app-container">
    <div class="top-header">
        <h2>PTMPay</h2>
        <div class="amount-title">Payment Amount</div>
        <div class="payment-amount" id="headerAmount">₹0</div>
        <div class="timer" id="timer">00:09:41</div>
    </div>

    <div class="tabs-container">
        <div id="tabDirect" class="tab-btn active" onclick="switchTab('direct')">Direct Transfer</div>
        <div id="tabQr" class="tab-btn" onclick="switchTab('qr')">Scan QRCode</div>
    </div>

    <div class="content-body">
        <div id="directContent">
            <div class="section-box">
                <div class="section-title">Select Payment App</div>
                <div class="methods-grid">
                    <a href="#" id="paytmAppBtn1" class="pay-method-btn">Paytm</a>
                    <a href="#" id="phonepeAppBtn1" class="pay-method-btn">PhonePe</a>
                </div>
            </div>
            <div class="warning-box">⚠️ Payment can only be made once.</div>
            <div class="transfer-box">
                <div class="copy-field" id="upiText" onclick="copyUpiText()">paytm.s2sqr95@pty <span style="font-size:12px; background:#059669; color:white; padding:3px 8px; border-radius:5px;">COPY</span></div>
                <div class="copy-field" id="amountText">0 RS</div>
                <input type="text" id="utrInputDirect" class="utr-input" placeholder="Enter 12-digit UTR">
                <button class="submit-btn" onclick="submitUTR('utrInputDirect')">Submit UTR</button>
            </div>
        </div>

        <div id="qrSection">
            <div class="qr-card">
                <div class="qr-wrapper"><div id="qrcode"></div></div>
                <input type="text" id="utrInputQr" class="utr-input" placeholder="Enter 12-digit UTR">
                <button class="submit-btn" onclick="submitUTR('utrInputQr')">Submit UTR</button>
            </div>
        </div>
    </div>
</div>

<div id="customModal" class="modal-overlay">
    <div class="modal-box">
        <h3 class="modal-title" id="modalTitle">Status</h3>
        <p class="modal-desc" id="modalDesc">Message</p>
        <button class="modal-btn" id="modalActionBtn" onclick="handleModalAction()">OK</button>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAyFldowBw6ChbopLGCCQ8U7_RH4kmyFpM",
      authDomain: "creditinvestapp.firebaseapp.com",
      projectId: "creditinvestapp",
      storageBucket: "creditinvestapp.firebasestorage.app",
      messagingSenderId: "299058832737",
      appId: "1:299058832737:web:fe1c1df553e209715c1120"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const amount = urlParams.get('amount') || '290';
    const upiID = "paytm.s2sqr95@pty";
    const userUID = localStorage.getItem('userUID') || localStorage.getItem('uid') || localStorage.getItem('userId') || 'GUEST';

    document.getElementById('headerAmount').innerText = "₹" + amount;
    document.getElementById('amountText').innerText = amount + " RS";

    const upiDeepLink = `upi://pay?pa=${upiID}&pn=Merchant&am=${amount}&cu=INR`;
    document.getElementById('paytmAppBtn1').href = upiDeepLink;
    document.getElementById('phonepeAppBtn1').href = upiDeepLink;

    new QRCode(document.getElementById("qrcode"), { text: upiDeepLink, width: 170, height: 170 });

    function switchTab(tab) {
        document.getElementById('directContent').style.display = (tab === 'direct') ? 'block' : 'none';
        document.getElementById('qrSection').style.display = (tab === 'qr') ? 'block' : 'none';
        document.getElementById('tabDirect').className = (tab === 'direct') ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tabQr').className = (tab === 'qr') ? 'tab-btn active' : 'tab-btn';
    }

    function copyUpiText() {
        navigator.clipboard.writeText(upiID);
        alert("UPI ID Copied: " + upiID);
    }

    let isSuccessState = false;

    function showModal(title, desc, color, isSuccess) {
        isSuccessState = isSuccess;
        const titleEl = document.getElementById('modalTitle');
        titleEl.innerText = title;
        titleEl.style.color = color;
        document.getElementById('modalDesc').innerText = desc;
        
        const btn = document.getElementById('modalActionBtn');
        btn.innerText = isSuccess ? "Back to History" : "OK";

        document.getElementById('customModal').classList.add('active');
    }

    function handleModalAction() {
        document.getElementById('customModal').classList.remove('active');
        if (isSuccessState) {
            window.location.href = 'recharge.html';
        }
    }

    function submitUTR(inputId) {
        const utr = document.getElementById(inputId).value.trim();
        
        if(!utr || utr.length < 12) {
            showModal('Invalid UTR', 'Please enter a valid 12-digit UTR number.', '#dc2626', false);
            return;
        }

        document.getElementById('merchantLoader').style.display = 'flex';

        setTimeout(() => {
            const orderId = 'REC' + Date.now();
            const paymentData = {
                orderId: orderId,
                uid: userUID,
                amount: Number(amount),
                utrNumber: utr,
                status: 'pending',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("recharges").doc(orderId).set(paymentData)
            .then(() => {
                document.getElementById('merchantLoader').style.display = 'none';
                showModal('Success', 'Payment Submitted Successfully! Please wait 5 minutes.', '#059669', true);
            })
            .catch(error => {
                document.getElementById('merchantLoader').style.display = 'none';
                showModal('Error', 'Failed: ' + error.message, '#dc2626', false);
            });
        }, 2000);
    }
</script>
</body>
</html>
