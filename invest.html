<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robot Investment Plans</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f0f2f5;display:flex;justify-content:center;min-height:100vh;color:#263238}
.app{width:100%;max-width:480px;min-height:100vh;background:#fff}
.hidden{display:none!important}

.header{
 height:58px;background:#00b050;color:#fff;padding:0 15px;
 display:flex;align-items:center;justify-content:space-between;
 position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,0.2)
}
.header-left{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px}
.icon-btn{width:32px;height:32px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.history-btn{border:0;background:rgba(255,255,255,0.25);color:#fff;border-radius:7px;padding:7px 9px;display:flex;align-items:center;gap:4px;font-weight:700;cursor:pointer}
.history-btn .svg{width:18px;height:18px}

.content{padding:15px}

.balance{
 background:linear-gradient(135deg,#00b050,#047835);
 color:#fff;border-radius:14px;padding:18px;margin-bottom:18px;
 display:flex;justify-content:space-between;align-items:center;
 box-shadow:0 5px 15px rgba(0,176,80,0.22)
}
.balance-title{font-size:11px;text-transform:uppercase;opacity:.9}
.balance-value{font-size:27px;font-weight:800;margin-top:4px}
.refresh{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,0.25);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.refresh .svg{width:22px;height:22px}

.plan{
 background:#fff;border:1px solid #e7e7e7;border-radius:16px;
 padding:14px;margin-bottom:15px;box-shadow:0 3px 10px rgba(0,0,0,0.06)
}
.plan-top{display:flex;gap:13px;align-items:center;margin-bottom:13px}
.robot{width:82px;height:82px;border-radius:12px;overflow:hidden;background:#edf2f0;border:1px solid #ddd;flex-shrink:0}
.robot img{width:100%;height:100%;object-fit:cover}
.plan-info{flex:1}
.plan-name{font-size:16px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.badge{background:#e8f8ef;color:#008a40;padding:3px 7px;border-radius:5px;font-size:9px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.label{font-size:10px;color:#777}
.value{font-size:14px;font-weight:800;color:#00a94f;margin-top:2px}
.black{color:#263238}
.buy{width:100%;border:0;background:#00b050;color:#fff;padding:12px;border-radius:24px;font-size:15px;font-weight:800;cursor:pointer}

.modal{
 position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;
 align-items:center;justify-content:center;padding:18px;z-index:100
}
.modal-box{width:100%;max-width:370px;background:#fff;border-radius:20px;padding:20px}
.modal-img{width:82px;height:82px;border-radius:13px;overflow:hidden;margin:0 auto 10px}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-title{text-align:center;font-size:19px;font-weight:800;margin-bottom:15px}

.quantity{
 display:flex;align-items:center;justify-content:space-between;
 background:#f5f7f8;border:1px solid #e4e8e9;border-radius:11px;
 padding:11px 12px;margin-bottom:14px
}
.qty-controls{display:flex;align-items:center;gap:13px}
.qty-btn{width:31px;height:31px;border:0;border-radius:7px;background:#00b050;color:#fff;font-size:20px;font-weight:800;cursor:pointer}
.qty-value{min-width:22px;text-align:center;font-weight:800}

.summary{background:#f5f7f8;border-radius:11px;padding:12px;margin-bottom:15px}
.row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.row strong{color:#00a94f}
.total{border-top:1px dashed #ccd4d8;margin-top:5px;padding-top:10px;font-weight:800}

.buttons{display:flex;gap:9px}
.modal-btn{flex:1;border:0;border-radius:22px;padding:12px;font-weight:800;cursor:pointer}
.cancel{background:#e6eaec;color:#555}
.confirm{background:#00b050;color:#fff}

.history{
 background:#fff;border:1px solid #eee;border-left:4px solid #00b050;
 border-radius:11px;padding:13px;margin-bottom:12px
}
.history-top{display:flex;gap:12px;align-items:center}
.history-img{width:62px;height:62px;border-radius:10px;overflow:hidden;flex-shrink:0}
.history-img img{width:100%;height:100%;object-fit:cover}
.history-title{font-size:14px;font-weight:800}
.history-meta{font-size:11px;color:#777;line-height:1.6;margin-top:4px}
.history-bottom{border-top:1px solid #eee;margin-top:10px;padding-top:9px;display:flex;justify-content:space-between;font-size:11px}
.status{color:#00a94f;font-weight:800}
</style>
</head>

<body>

<div class="app">

<!-- PLANS PAGE -->
<section id="plansPage">
<header class="header">
<div class="header-left">
<a href="index.html" class="icon-btn">
<svg class="svg" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
</a>
Robot Plans
</div>
<button class="history-btn" onclick="openHistory()">
<svg class="svg" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/><path d="M12 7v5l3 2"/></svg>
History
</button>
</header>

<div class="content">
<div class="balance">
<div>
<div class="balance-title">Firebase Balance</div>
<div class="balance-value">₹<span id="balance">0.00</span></div>
</div>
<button class="refresh" onclick="loadBalance()">
<svg class="svg" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-15-4"/><path d="M3 4v6h6"/><path d="M4 13a8 8 0 0 0 15 4"/><path d="M21 20v-6h-6"/></svg>
</button>
</div>
<div id="plans"></div>
</div>
</section>

<!-- HISTORY PAGE -->
<section id="historyPage" class="hidden">
<header class="header">
<div class="header-left">
<button class="icon-btn" onclick="closeHistory()">
<svg class="svg" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
</button>
Plan History
</div>
</header>
<div class="content">
<div id="historyList"></div>
</div>
</section>

</div>

<!-- PURCHASE POPUP -->
<div class="modal" id="purchaseModal">
<div class="modal-box">
<div class="modal-img">
<img id="modalImage" src="" alt="Robot">
</div>
<div class="modal-title" id="modalTitle"></div>
<div class="quantity">
<span>Quantity</span>
<div class="qty-controls">
<button class="qty-btn" onclick="changeQty(-1)">−</button>
<span class="qty-value" id="qty">1</span>
<button class="qty-btn" onclick="changeQty(1)">+</button>
</div>
</div>
<div class="summary">
<div class="row"><span>Plan Price</span><strong id="price">₹0</strong></div>
<div class="row"><span>Quantity</span><strong id="quantityText">1</strong></div>
<div class="row"><span>Total Amount</span><strong id="amount">₹0</strong></div>
<div class="row"><span>Daily Calculation</span><strong id="daily">₹0</strong></div>
<div class="row total"><span>30-Day Calculation</span><strong id="total">₹0</strong></div>
</div>
<div class="buttons">
<button class="modal-btn cancel" onclick="closePurchase()">Cancel</button>
<button class="modal-btn confirm" onclick="savePurchase()">Confirm Purchase</button>
</div>
</div>
</div>

<!-- NOTICE POPUP -->
<div class="modal" id="notice">
<div class="modal-box">
<div class="modal-title" id="noticeTitle">Information</div>
<p id="noticeText" style="text-align:center;color:#666;font-size:13px;line-height:1.6;margin-bottom:18px"></p>
<button class="modal-btn confirm" style="width:100%" onclick="closeNotice()">OK</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, collection, addDoc, query, where, getDocs, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAyFldowBw6ChbopLGCCQ8U7_RH4kmyFpM",
  authDomain: "creditinvestapp.firebaseapp.com",
  projectId: "creditinvestapp",
  storageBucket: "creditinvestapp.firebasestorage.app",
  messagingSenderId: "299058832737",
  appId: "1:299058832737:web:fe1c1df553e209715c1120"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let uid = localStorage.getItem("bgf_uid") || localStorage.getItem("userUID") || localStorage.getItem("uid") || localStorage.getItem("userId");
if(!uid){
  uid = "USER_" + Math.floor(100000 + Math.random() * 900000);
  localStorage.setItem("bgf_uid", uid);
}

const plans = [
  { vip: "VIP1", price: 290, daily: 43.50, image: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=600&q=85" },
  { vip: "VIP2", price: 380, daily: 57, image: "https://images.unsplash.com/photo-1535378917042-10a22c95931a?auto=format&fit=crop&w=600&q=85" },
  { vip: "VIP3", price: 560, daily: 84, image: "https://images.unsplash.com/photo-1487887235947-a955ef187fcc?auto=format&fit=crop&w=600&q=85" },
  { vip: "VIP4", price: 1080, daily: 162, image: "https://images.unsplash.com/photo-1563191911-e65f8655ebf9?auto=format&fit=crop&w=600&q=85" },
  { vip: "VIP5", price: 2250, daily: 337.50, image: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=85" },
  { vip: "VIP6", price: 3822, daily: 573.30, image: "https://images.unsplash.com/photo-1531746790731-6c087fecd65a?auto=format&fit=crop&w=600&q=85" }
];

let selectedPlan = null;
let selectedQty = 1;
let currentBalance = 0;
let totalDailyIncome = 0;

const plansBox = document.getElementById("plans");
plans.forEach(plan => {
  const total = plan.daily * 30;
  const el = document.createElement("div");
  el.className = "plan";
  el.innerHTML = `
    <div class="plan-top">
      <div class="robot"><img src="${plan.image}" alt="${plan.vip}"></div>
      <div class="plan-info">
        <div class="plan-name">Robot ${plan.vip} <span class="badge">30 DAYS</span></div>
        <div class="grid">
          <div><div class="label">Plan Price</div><div class="value">₹${plan.price.toLocaleString("en-IN")}</div></div>
          <div><div class="label">Daily Calculation</div><div class="value">₹${plan.daily.toLocaleString("en-IN")}</div></div>
          <div><div class="label">Duration</div><div class="value black">30 Days</div></div>
          <div><div class="label">30-Day Calculation</div><div class="value black">₹${total.toLocaleString("en-IN")}</div></div>
        </div>
      </div>
    </div>
    <button class="buy">Purchase Plan</button>
  `;
  el.querySelector(".buy").addEventListener("click", () => openPurchase(plan));
  plansBox.appendChild(el);
});

window.openPurchase = function(plan){
  selectedPlan = plan;
  selectedQty = 1;
  document.getElementById("modalImage").src = plan.image;
  document.getElementById("modalTitle").innerText = "Robot " + plan.vip;
  updateCalculation();
  document.getElementById("purchaseModal").style.display = "flex";
};

window.changeQty = function(n){
  selectedQty += n;
  if(selectedQty < 1) selectedQty = 1;
  if(selectedQty > 10) selectedQty = 10;
  updateCalculation();
};

function updateCalculation(){
  if(!selectedPlan) return;
  const amount = selectedPlan.price * selectedQty;
  const daily = selectedPlan.daily * selectedQty;
  const total = daily * 30;

  document.getElementById("qty").innerText = selectedQty;
  document.getElementById("quantityText").innerText = selectedQty;
  document.getElementById("price").innerText = "₹" + selectedPlan.price.toLocaleString("en-IN");
  document.getElementById("amount").innerText = "₹" + amount.toLocaleString("en-IN");
  document.getElementById("daily").innerText = "₹" + daily.toLocaleString("en-IN");
  document.getElementById("total").innerText = "₹" + total.toLocaleString("en-IN");
}

window.closePurchase = function(){
  document.getElementById("purchaseModal").style.display = "none";
};

window.savePurchase = async function(){
  if(!selectedPlan) return;
  const amount = selectedPlan.price * selectedQty;
  const newPlanDaily = selectedPlan.daily * selectedQty;

  if(currentBalance < amount){
    closePurchase();
    showNotice("Insufficient Balance", "Your wallet balance is insufficient to purchase this plan.");
    return;
  }

  try {
    const userRef = doc(db, "users", uid);
    const newBalance = currentBalance - amount;
    const updatedDailyIncome = totalDailyIncome + newPlanDaily;
    
    // Update balance and cumulative daily income in Firestore
    await updateDoc(userRef, {
      balance: newBalance,
      amount: newBalance,
      wallet: newBalance,
      totalDailyIncome: updatedDailyIncome,
      lastCredited: Timestamp.now()
    });

    // Save purchase history
    await addDoc(collection(db, "planPurchases"), {
      uid: uid,
      vipCode: selectedPlan.vip,
      planName: "Robot " + selectedPlan.vip,
      price: selectedPlan.price,
      quantity: selectedQty,
      totalAmount: amount,
      dailyCalculation: newPlanDaily,
      thirtyDayCalculation: newPlanDaily * 30,
      image: selectedPlan.image,
      status: "Purchased",
      timestamp: serverTimestamp()
    });

    currentBalance = newBalance;
    totalDailyIncome = updatedDailyIncome;
    document.getElementById("balance").innerText = currentBalance.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    closePurchase();
    showNotice("Purchase Successful", `${selectedQty} × ${selectedPlan.vip} has been successfully purchased!`);
  } catch(error) {
    console.error(error);
    closePurchase();
    showNotice("Firebase Error", "Could not complete the purchase. Please check Firestore rules or connection.");
  }
};

window.loadBalance = async function(){
  const el = document.getElementById("balance");
  el.innerText = "...";
  try {
    const ref = doc(db, "users", uid);
    const snap = await getDoc(ref);
    if(!snap.exists()){
      currentBalance = 0;
      totalDailyIncome = 0;
      el.innerText = "0.00";
      return;
    }
    const data = snap.data();
    let balance = Number(data.balance ?? data.amount ?? data.wallet ?? 0);
    totalDailyIncome = Number(data.totalDailyIncome || 0);

    // Automatic Daily Income Accumulation Logic
    if (totalDailyIncome > 0) {
      const lastCredited = data.lastCredited?.toDate ? data.lastCredited.toDate() : new Date();
      const now = new Date();
      const diffTime = now - lastCredited;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays >= 1) {
        let addedEarnings = diffDays * totalDailyIncome;
        balance += addedEarnings;

        await updateDoc(ref, {
          balance: balance,
          amount: balance,
          wallet: balance,
          lastCredited: Timestamp.now()
        });
      }
    }

    currentBalance = balance;
    el.innerText = currentBalance.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  } catch(error) {
    console.error(error);
    el.innerText = "0.00";
    showNotice("Firebase Error", "Failed to read wallet balance.");
  }
};

window.openHistory = async function(){
  document.getElementById("plansPage").classList.add("hidden");
  document.getElementById("historyPage").classList.remove("hidden");
  const box = document.getElementById("historyList");
  box.innerHTML = '<p style="text-align:center;color:#777;">Loading...</p>';

  try {
    const q = query(collection(db, "planPurchases"), where("uid", "==", uid));
    const snapshot = await getDocs(q);

    if(snapshot.empty){
      box.innerHTML = '<p style="text-align:center;color:#777;margin-top:25px;">No purchase history found.</p>';
      return;
    }

    box.innerHTML = "";
    snapshot.forEach(docSnap => {
      const d = docSnap.data();
      const image = d.image || plans.find(p => p.vip === d.vipCode)?.image || plans[0].image;
      const date = d.timestamp?.toDate ? d.timestamp.toDate().toLocaleString("en-IN") : "Recent";
      const quantity = Number(d.quantity || 1);

      box.innerHTML += `
        <div class="history">
          <div class="history-top">
            <div class="history-img"><img src="${image}" alt="Robot"></div>
            <div>
              <div class="history-title">${d.planName || "Robot Plan"}</div>
              <div class="history-meta">
                Quantity: <b>${quantity}</b><br>
                Plan Price: ₹${Number(d.price || 0).toLocaleString("en-IN")}<br>
                Total Amount: ₹${Number(d.totalAmount || 0).toLocaleString("en-IN")}<br>
                Daily Calculation: ₹${Number(d.dailyCalculation || 0).toLocaleString("en-IN")}
              </div>
            </div>
          </div>
          <div class="history-bottom">
            <span>${date}</span>
            <span class="status">${d.status || "Purchased"}</span>
          </div>
        </div>
      `;
    });
  } catch(error) {
    console.error(error);
    box.innerHTML = '<p style="text-align:center;color:#d33;">Failed to load Firebase history.</p>';
  }
};

window.closeHistory = function(){
  document.getElementById("historyPage").classList.add("hidden");
  document.getElementById("plansPage").classList.remove("hidden");
};

window.showNotice = function(title, text){
  document.getElementById("noticeTitle").innerText = title;
  document.getElementById("noticeText").innerText = text;
  document.getElementById("notice").style.display = "flex";
};

window.closeNotice = function(){
  document.getElementById("notice").style.display = "none";
};

loadBalance();
</script>

</body>
</html>
