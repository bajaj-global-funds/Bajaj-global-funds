<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        
        body { 
            background: #f7f8fa; 
            display: flex; 
            justify-content: center; 
            width: 100vw; 
            min-height: 100vh; 
        }
        
        .mobile-screen {
            width: 100%; 
            max-width: 480px; 
            background: #f7f8fa; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            position: relative;
        }

        .header { 
            background: #00b050; 
            color: white; 
            padding: 16px 20px; 
            font-weight: bold; 
            font-size: 18px; 
            position: sticky; 
            top: 0; 
            z-index: 100;
        }
        
        .content { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
        }

        .plan-card { 
            background: white; 
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 15px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
            border: 1px solid #eee;
        }
        
        .card-inner { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 15px; 
            align-items: center; 
        }
        
        .img-box { 
            width: 85px; 
            height: 85px; 
            border-radius: 12px; 
            overflow: hidden; 
            background: #f0f0f0; 
            flex-shrink: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border: 1px solid #ddd;
        }
        
        .img-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .info { flex: 1; }
        .title { font-weight: 800; font-size: 16px; margin-bottom: 10px; color: #2d3436; }
        
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            font-size: 13px; 
        }
        
        .label { color: #636e72; font-size: 11px; }
        .val { font-weight: bold; color: #d35400; font-size: 14px; }
        .val-black { color: #2d3436; }

        .btn { 
            background: #00b050; 
            color: white; 
            width: 100%; 
            padding: 12px; 
            border-radius: 25px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 15px; 
            cursor: pointer; 
            border: none;
        }

        /* Popup Modal CSS */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background: white; width: 85%; max-width: 320px; border-radius: 20px;
            padding: 20px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            animation: popupScale 0.3s ease-in-out;
        }
        @keyframes popupScale {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-box h3 { color: #e74c3c; margin-bottom: 10px; font-size: 18px; }
        .modal-box p { font-size: 14px; color: #444; margin-bottom: 20px; line-height: 1.5; }
        .modal-btn-group { display: flex; gap: 10px; }
        .modal-btn {
            background: #00b050; color: white; border: none; padding: 10px;
            border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; flex: 1;
        }
        .modal-btn-cancel {
            background: #ccc; color: #333;
        }
    </style>
</head>
<body>

<div class="mobile-screen">
    <div class="header">&lt; Investment List</div>
    <div class="content" id="list"></div>
</div>

<!-- Insufficient Balance Popup Modal -->
<div class="modal-overlay" id="popupModal">
    <div class="modal-box">
        <h3 id="modalTitle">Insufficient Balance</h3>
        <p id="popupText">Your account balance is not enough to purchase this plan. Please recharge first.</p>
        <div class="modal-btn-group">
            <button class="modal-btn modal-btn-cancel" onclick="closePopup()">Cancel</button>
            <button class="modal-btn" onclick="rechargeAction()">Recharge</button>
        </div>
    </div>
</div>

<script>
    const data = [
        { vip: "VIP1", price: "290.00", daily: "70.0", total: "3430.0", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300&auto=format&fit=crop&q=60" },
        { vip: "VIP2", price: "380.00", daily: "95.0", total: "4655.0", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300&auto=format&fit=crop&q=60" },
        { vip: "VIP3", price: "560.00", daily: "150.0", total: "7350.0", img: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=300&auto=format&fit=crop&q=60" },
        { vip: "VIP4", price: "1080.00", daily: "300.0", total: "14700.0", img: "https://images.unsplash.com/photo-1503602642458-232111445657?w=300&auto=format&fit=crop&q=60" },
        { vip: "VIP5", price: "2260.00", daily: "650.0", total: "31850.0", img: "https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=300&auto=format&fit=crop&q=60" },
        { vip: "VIP6", price: "3250.00", daily: "980.0", total: "48020.0", img: "https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=300&auto=format&fit=crop&q=60" }
    ];

    const list = document.getElementById('list');
    data.forEach((item) => {
        list.innerHTML += `
            <div class="plan-card">
                <div class="card-inner">
                    <div class="img-box"><img src="${item.img}" alt="Product"></div>
                    <div class="info">
                        <div class="title">Purchase upgrade to ${item.vip}</div>
                        <div class="grid">
                            <div><div class="label">Each Price</div><div class="val">₹${item.price}</div></div>
                            <div><div class="label">Daily Earnings</div><div class="val">₹${item.daily}</div></div>
                            <div><div class="label">Maximum</div><div class="val val-black">1 Copies</div></div>
                            <div><div class="label">Total revenue</div><div class="val val-black">₹${item.total}</div></div>
                        </div>
                    </div>
                </div>
                <button class="btn" onclick="openPopup('${item.vip}', '${item.price}')">Invest Now</button>
            </div>
        `;
    });

    function openPopup(vipName, price) {
        document.getElementById('popupText').innerText = `Insufficient balance to buy ${vipName} (₹${price}). Please recharge your account to proceed.`;
        document.getElementById('popupModal').style.display = 'flex';
    }

    function closePopup() {
        document.getElementById('popupModal').style.display = 'none';
    }

    function rechargeAction() {
        alert("Redirecting to Recharge Page...");
        closePopup();
    }
</script>
</body>
</html>
